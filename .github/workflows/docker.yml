# Build ảnh Docker của GGD Hub trên GitHub và đẩy lên GitHub Container Registry (GHCR), để máy
# chủ (README mục 6C) chỉ cần tải ảnh về — không phải tự build trên máy 1 GB RAM.
#
# Ảnh: ghcr.io/<owner>/<repo> (chữ thường), mỗi lần đẩy có hai tag:
#   - tên nhánh (vd `feat-ggd-hub-v1`) — luôn trỏ tới commit mới nhất của nhánh;
#   - mã commit đầy đủ (40 ký tự) — update.sh tải đúng tag này cho commit vừa `git pull`.
name: Docker image

on:
  push:
    branches: [feat/ggd-hub-v1, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Hai lần đẩy liền nhau: huỷ lần cũ, để tag nhánh không bị bản cũ hơn ghi đè sau cùng.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tên ảnh viết thường; nhãn org.opencontainers.image.source gắn package với repo.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=long,prefix=

      # Máy chủ e2-micro / Lightsail là x86 → chỉ cần linux/amd64.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
