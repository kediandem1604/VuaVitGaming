# CI của GGD Hub: kiểm tra kiểu, chạy toàn bộ test (PostgreSQL nhúng, không cần
# dịch vụ database riêng) và build ảnh Docker giống Railway.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Prisma Client phải được sinh trước khi tsc đọc kiểu của nó.
      - run: npx prisma generate

      - run: npm run typecheck

      # global-setup tự bật PostgreSQL nhúng ở cổng 54330 (dữ liệu ở ~/ggd-hub/pgdata-test).
      - run: npm test

      - run: docker build .
