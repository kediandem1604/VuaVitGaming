# GGD Hub trên một máy chủ Ubuntu (Google Cloud, AWS Lightsail…) — hướng dẫn: README mục 6C.
#
#   caddy   : cổng 80/443 ra Internet, tự xin chứng chỉ HTTPS (Let's Encrypt) cho SITE_ADDRESS,
#             chuyển mọi yêu cầu vào app:3000. Là lớp proxy duy nhất → TRUST_PROXY_HOPS=1.
#   app     : build từ Dockerfile ở gốc repo; `npm start` = migrate → nạp dữ liệu tham chiếu → chạy.
#             Không mở cổng ra ngoài — chỉ caddy gọi tới qua mạng nội bộ của compose.
#   db      : PostgreSQL 16, dữ liệu trong volume `pgdata`; không mở cổng ra ngoài.
#   backup  : mỗi ngày pg_dump → ./backups/ggd-YYYY-MM-DD.sql.gz, giữ 14 bản gần nhất.
#
# Mọi giá trị lấy từ ./.env (tạo bởi setup.sh từ .env.example; không bao giờ commit).
# Chạy trong thư mục này: `docker compose up -d --build` (update.sh làm hộ).

name: ggd-hub-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?đặt SITE_ADDRESS trong .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    logging: *logging

  app:
    build:
      context: ../..
    restart: unless-stopped
    env_file: .env
    environment:
      # Mật khẩu do setup.sh sinh dạng hex nên ghép thẳng vào URL được, không cần mã hoá.
      DATABASE_URL: postgresql://ggd:${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong .env}@db:5432/ggd
      # Một nguồn duy nhất cho địa chỉ web: đổi SITE_ADDRESS là PUBLIC_URL đổi theo.
      PUBLIC_URL: https://${SITE_ADDRESS}
      PORT: '3000'
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ggd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ggd
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: chờ máy chủ thật (TCP), không phải bản tạm lúc khởi tạo chỉ nghe socket.
      test: ['CMD-SHELL', 'pg_isready -U ggd -d ggd -h 127.0.0.1']
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ggd
      PGDATABASE: ggd
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: '14'
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    # Chờ 10 phút (để ứng dụng migrate xong — lần chạy đầu database còn trống), sao lưu, rồi cứ
    # 24 giờ một lần; xoá bản cũ hơn KEEP_DAYS ngày. Mỗi lần update.sh khởi động lại cũng có
    # thêm một bản. `$$` để compose không tự thay biến — shell trong container mới thay.
    entrypoint:
      - sh
      - -c
      - |
        sleep 600
        while true; do
          file="/backups/ggd-$$(date +%F).sql.gz"
          if pg_dump --no-owner | gzip > "$$file.tmp"; then
            mv "$$file.tmp" "$$file"
            echo "Đã sao lưu $$file"
          else
            rm -f "$$file.tmp"
            echo "Sao lưu thất bại" >&2
          fi
          find /backups -name 'ggd-*.sql.gz' -mtime +$$KEEP_DAYS -delete
          sleep 86400
        done
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
